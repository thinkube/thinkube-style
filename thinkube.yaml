apiVersion: thinkube.io/v1
kind: ThinkubeDeployment
metadata:
  # The application's version; the generated app starts at it.
  version: "0.1.0"
  name: "{{ project_name }}"

spec:
  deployment:
    type: app

  containers:
    - name: frontend
      build: .
      port: 80
      size: small
      health: /health

  routes:
    - path: /
      to: frontend
